  </g>
  <text x="64" y="36" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="2" fill="#F6F1EA">GAPSMAN</text>
  <text x="65" y="50" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="8.5" letter-spacing="1.3" fill="#c9b9b0">MACHINE-ORIENTED 3D ENGINE</text>
