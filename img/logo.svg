<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" role="img" aria-label="Gapsman">
  <defs>
    <linearGradient id="gm-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7D58A"/><stop offset="1" stop-color="#E8B04A"/></linearGradient>
    <linearGradient id="gm-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98A2E"/><stop offset="1" stop-color="#9A6420"/></linearGradient>
    <linearGradient id="gm-r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A2443"/><stop offset="1" stop-color="#5C1F3A"/></linearGradient>
  </defs>
  <!-- marchio: un volume isometrico tagliato da una sezione (il gesto del modellatore: estrudi, poi taglia) -->
