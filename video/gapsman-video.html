<meta charset="utf-8">
<title>GapsMan Video</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a 1280x720 stage scaled to fit, with a player bar under it. Single dark theme taken from the GapsMan modeler UI. */
:root{
  --ink:#2A151D; --ink2:#3a222b; --ink3:#52343f; --paper:#F6F1EA; --mute:#c9b9b0; --acc:#E8B04A; --crim:#5C1F3A;
  --blue:#7aa7d6; --green:#8fc59a; --pink:#c98fb1; --bg:#170b10; --panel:#2b2027; --cmd:#232634; --menu:#3a2129; --tools:#251c22;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#player{position:relative;height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;box-sizing:border-box}
#wrap{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;border-radius:10px;
  background:radial-gradient(ellipse at 30% 20%,#2a141c 0%,#1a0c12 60%,#130810 100%);box-shadow:0 0 0 1px #3a222b}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:12px;font:13px var(--ui);color:var(--mute);min-width:0}
#pp{width:36px;height:30px;border-radius:6px;border:1px solid var(--ink3);background:var(--ink2);color:var(--paper);font:14px var(--ui);cursor:pointer}
#pp:focus-visible,#prog:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#sname{color:var(--paper);font-weight:600;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#prog{position:relative;flex:1;height:14px;cursor:pointer;min-width:60px}
#prog .segs{position:absolute;inset:4px 0;display:flex;gap:2px}
#prog .segs i{display:block;height:100%;background:var(--ink3);border-radius:2px}
#prog .fill{position:absolute;left:0;top:4px;bottom:4px;background:var(--acc);border-radius:2px;pointer-events:none;mix-blend-mode:normal;opacity:.9}
#time{font:12px var(--mono);white-space:nowrap}
.hint{font:12px var(--ui);white-space:nowrap}
@media (max-width:700px){.hint{display:none}#sname{max-width:120px}}

/* stage pieces */
.A{position:absolute}
.stitle{left:28px;top:20px;display:flex;gap:10px;align-items:center;font:600 15px var(--ui);color:var(--paper);z-index:20}
.stitle b{font:12px var(--mono);color:var(--ink);background:var(--acc);padding:2px 7px;border-radius:4px}
.exb{right:24px;top:20px;font:600 11px var(--ui);letter-spacing:.12em;color:var(--acc);border:1px solid var(--acc);padding:3px 8px;border-radius:4px;z-index:20}
.card{background:var(--panel);border:1px solid var(--ink3);border-radius:9px;padding:12px 14px;box-sizing:border-box}
.lbl{font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;font:12px var(--mono);background:#0005;border:1px solid var(--ink3);color:var(--paper);white-space:nowrap}
.chip.acc{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.big{font:700 30px var(--ui);letter-spacing:.01em}
.cap{font:15px/1.45 var(--ui);color:var(--mute)}
.code{font:12.5px/1.6 var(--mono);color:var(--paper)}
.code .k{color:var(--acc)} .code .s{color:#b9d3ea} .code .c{color:#8a7a74}
.pk{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc);z-index:30;margin:-6px 0 0 -6px}
.pk.p{background:var(--paper);box-shadow:0 0 14px var(--paper)}
.pk.b{background:var(--blue);box-shadow:0 0 14px var(--blue)}
.pkl{font:12px var(--mono);color:var(--paper);background:#000a;padding:2px 6px;border-radius:4px;white-space:nowrap;z-index:31;transform:translate(10px,-24px)}
.grid-bg{inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}

/* GapsMan frame (widget) rebuilt */
.gf{position:absolute;background:var(--ink);border:1px solid var(--ink3);border-radius:10px;overflow:hidden;box-shadow:0 24px 60px #0009}
.gf .ab{position:absolute;left:0;right:0;top:0;height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;background:var(--ink);border-bottom:1px solid var(--ink3);font:13px var(--ui);box-sizing:border-box;z-index:3}
.gf .ab code{font:12px var(--mono);background:#0005;padding:2px 6px;border-radius:4px;white-space:nowrap}
.gf .ab b{white-space:nowrap}
.gf .ab span{color:var(--mute);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf .ab button{background:transparent;color:var(--paper);border:1px solid var(--ink3);border-radius:6px;padding:2px 8px;font:12px var(--ui);white-space:nowrap}
.gf .ab .abm{background:var(--acc);color:var(--ink);border:0;font-weight:700;padding:3px 9px}
.gf .ab .abm.human{background:#000;color:var(--paper);border:1px solid var(--ink3)}
.gf .views{position:absolute;left:0;right:0;top:34px;background:#120a0e}
.gf .vp{position:absolute;background:#22141a;overflow:hidden}
.gf .vp.act{box-shadow:inset 0 0 0 1px var(--acc)}
.gf .vp i{position:absolute;left:7px;top:4px;font:11px var(--ui);font-style:normal;color:var(--mute);z-index:2}
.gf .vp svg{position:absolute;inset:0;width:100%;height:100%}
.gf .cot{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#140b10e6;border-top:2px solid var(--acc);font:13px var(--mono);z-index:4;box-sizing:border-box}
.gf .cot .tag{color:var(--acc);font-weight:700;letter-spacing:.04em}
.gf .cot .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .26s ease,transform .26s ease,filter .26s ease}
.gf .cot .txt.out{opacity:0;transform:translateY(-7px);filter:blur(2px)}
.gf .cot .txt.in{animation:gIn .38s ease both}
.gf .cot.live .txt{background:linear-gradient(90deg,var(--paper) 0%,var(--paper) 38%,#fff6 50%,var(--paper) 62%,var(--paper) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gSh 2.2s linear infinite}
.gf .cot.live .txt.in{animation:gIn .38s ease both,gSh 2.2s linear infinite}
@keyframes gIn{from{opacity:0;transform:translateY(7px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
@keyframes gSh{from{background-position:120% 0}to{background-position:-120% 0}}
.gf .rows{position:absolute;left:0;right:0;bottom:0;overflow:hidden;z-index:2}
.gf .rin{position:absolute;left:0;right:0;top:0;height:188px}
.gf .row{position:absolute;left:0;right:0;display:flex;align-items:center;gap:4px;padding:0 8px;box-sizing:border-box;font:12px var(--ui);white-space:nowrap;overflow:hidden}
.gf .r-top{top:0;height:30px;background:var(--menu);border-top:3px solid #e8b04a}
.gf .r-top b{margin-right:8px}
.gf .r-top .m{padding:2px 7px;border-radius:4px;border:1px solid #ffffff14}
.gf .r-bar{top:30px;height:30px;background:var(--cmd);border-top:3px solid var(--blue)}
.gf .r-bar .h{color:var(--mute);font:12px var(--mono);padding:1px 6px;border-radius:3px;background:#0004}
.gf .r-bar .in{flex:1;height:20px;background:#0006;border:1px solid #ffffff22;border-radius:4px;font:12px var(--mono);display:flex;align-items:center;padding:0 6px;color:var(--paper)}
.gf .r-bar .in u{display:inline-block;width:7px;height:14px;background:var(--paper);margin-left:1px;text-decoration:none;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.gf .r-snap{top:60px;height:26px;background:var(--cmd)}
.gf .r-snap .st{font:11.5px var(--mono);color:var(--mute);padding-right:8px}
.gf .r-snap .b{padding:1px 7px;border-radius:4px;border:1px solid #ffffff1c}
.gf .r-snap .b.on{background:var(--paper);color:var(--ink)}
.gf .r-tools{top:86px;height:32px;background:var(--tools);border-top:3px solid var(--green);gap:4px}
.gf .r-tools .g{display:flex;gap:2px;padding:2px 3px;border-radius:6px}
.gf .r-tools .t{width:24px;height:22px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #ffffff18}
.gf .r-tools .t svg{width:15px;height:15px;fill:none;stroke:var(--paper);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gf .r-tools .t.on{background:var(--paper)} .gf .r-tools .t.on svg{stroke:var(--ink)}
.gf .r-side{top:118px;height:70px;background:var(--panel);border-top:3px solid var(--pink);align-items:flex-start;padding-top:5px;gap:28px}
.gf .r-side div{display:flex;flex-direction:column;gap:2px;font:11.5px var(--ui);color:var(--mute)}
.gf .r-side div b{color:var(--paper);font-size:12px}
.hl{position:absolute;border:2px solid var(--acc);border-radius:4px;box-shadow:0 0 18px #e8b04a88;z-index:6;pointer-events:none}
.done{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1px solid #5c1f3a66;border-radius:8px;font:13px var(--ui);color:#2A151D;background:#F6F1EA;box-sizing:border-box;height:44px}
.done code{font:12px var(--mono);background:#2A151D14;padding:2px 6px;border-radius:4px}
.done span{color:#7a6a64;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cursor{width:22px;height:26px;z-index:40;pointer-events:none}
.ring{border:2px solid var(--acc);border-radius:10px;z-index:40;pointer-events:none}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--ink3);background:#0003;transition:none}
.step .n{font:700 12px var(--mono);color:var(--ink);background:var(--mute);border-radius:4px;padding:1px 6px;flex:0 0 auto}
.step.on{border-color:var(--acc);background:#e8b04a14}
.step.on .n{background:var(--acc)}
.step b{font:600 14px var(--mono);color:var(--paper)}
.step p{margin:3px 0 0;font:13px/1.4 var(--ui);color:var(--mute)}
.paper{background:#F6F1EA;border-radius:6px}
.res{font:700 11px var(--mono);padding:1px 6px;border-radius:3px}
.res.pass{background:#8fc59a;color:#15301b}.res.fail{background:#e07a7a;color:#3a0d0d}.res.wait{background:#52343f;color:#c9b9b0}
.sev{font:11px var(--mono);padding:1px 5px;border-radius:3px;border:1px solid}
.sev.c{color:#ff9d9d;border-color:#ff9d9d88}.sev.M{color:#e8b04a;border-color:#e8b04a88}.sev.m{color:#c9b9b0;border-color:#c9b9b088}
.aprobar{background:var(--acc);color:var(--ink);font:700 13px var(--ui);border-radius:6px;padding:5px 14px;border:0}
.tile{background:var(--panel);border:1px solid var(--ink3);border-radius:9px;overflow:hidden;box-sizing:border-box}
.tile h4{margin:0;padding:8px 12px;font:600 13px var(--mono);color:var(--acc);border-bottom:1px solid var(--ink3);display:flex;justify-content:space-between;gap:8px}
.tile h4 em{font:12px var(--ui);font-style:normal;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.gf .cot.live .txt{animation:none;color:var(--paper);background:none}}
#startov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,10,14,.72);cursor:pointer;font:600 15px var(--ui);color:var(--paper)}
#startov b{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:var(--acc);color:#fff;font-size:38px;padding-left:6px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#startov.off{display:none}
#fs{background:none;border:1px solid var(--ink3);color:var(--paper);border-radius:6px;font:600 12px var(--ui);padding:4px 8px;cursor:pointer;white-space:nowrap}
#fsx{display:none;position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:60;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.62);color:#fff;font:700 14px var(--ui);cursor:pointer;backdrop-filter:blur(6px)}
body.isfs #fsx{display:inline-flex}

#mu{background:none;border:1px solid #52343f;color:var(--paper);border-radius:6px;font:600 12px var(--ui);padding:4px 8px;cursor:pointer}
</style>

<style id="mai-load-css">#mai-load{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:var(--mai-load-bg,#10131B);transition:opacity .35s ease}

<script>(() => { /* hide the loading screen as soon as the voice is really playing */
  const ov = document.getElementById('mai-load');
  const hide = () => ov.classList.add('off');
  if (/[?&](t=|autoplay=0)/.test(location.search)) { hide(); return; }
  const watch = a => { const ok = () => { if (a.currentTime > 0.02 && !a.paused) hide(); }; a.addEventListener('timeupdate', ok); a.addEventListener('playing', ok); };
  const find = () => { const a = document.querySelector('audio'); if (a) watch(a); else setTimeout(find, 50); };
  find(); setTimeout(hide, 9000);
  window.__maiLoaderShow = () => ov.classList.remove('off');
})();</script>

  c.ts.innerHTML = o + '</svg>';

} };

  const t = ['You write.', 'The machine draws.'].map((s, i) => A(r, '', 380 + i * 240, 500, 280, null, `<div style="text-align:center;font:600 28px var(--ui);color:${i ? 'var(--acc)' : 'var(--paper)'}">${s}</div>`));

}, update(c, lt) { fadeUp(c.m, es(lt, 0, .8)); c.t.forEach((e, i) => fadeUp(e, es(lt, .9 + i * .7, 1.5 + i * .7))); } };

const PR = rescaleS(OLD[2], 15); PR.title = 'You write, the machine draws';

/* ---------- player ---------- */
const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
const starts = []; let TOTAL = 0; for (const s of SC) { starts.push(TOTAL); TOTAL += s.dur; }
const segs = document.querySelector('#prog .segs'); segs.innerHTML = SC.map(s => `<i style="flex:${s.dur}" title="${esc(s.title)}"></i>`).join('');
const fill = document.querySelector('#prog .fill'), pp = document.getElementById('pp'), sname = document.getElementById('sname'), tim = document.getElementById('time');
let t = 0, playing = false, started = false, last = performance.now(), cur = -1, ctx = null;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function fit() { const s = Math.min(wrap.clientWidth / 1280, wrap.clientHeight / 720); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
function enter(i) {
  cur = i; stage.innerHTML = '';
  const root = A(stage, '', 0, 0, 1280, 720);
  const s = SC[i];
  A(root, 'stitle', null, null, null, null, `<b>${String(i + 1).padStart(2, '0')}/${SC.length}</b>${esc(s.title)}`);
  if (s.ex) A(root, 'exb', null, null, null, null, 'EXAMPLE DATA');
  ctx = s.build(root);
  sname.textContent = s.title;
}
function render() {
  let i = 0; while (i < SC.length - 1 && t >= starts[i + 1]) i++;
  if (i !== cur) enter(i);
  SC[i].update(ctx, Math.min(t - starts[i], SC[i].dur));
  fill.style.width = (t / TOTAL * 100) + '%'; tim.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
  pp.textContent = playing ? '❚❚' : '▶'; pp.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
let hold = 0;
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) {
    // the voice is the clock while it plays; otherwise the frame timer
    if (!vo.paused && !vo.muted && vo.readyState >= 2 && Math.abs(vo.currentTime - t) < .5) t = vo.currentTime; else if (vo.readyState >= 3 || vo.muted || (hold += dt) > 6) t += dt; /* wait for the voice to be ready, at most 6 s */
    if (Math.abs(vo.currentTime - t) > .25 && vo.readyState >= 1) vo.currentTime = t;
    if (vo.paused && t < TOTAL - .2) vo.play().catch(() => {});
    if (t >= TOTAL) { t = TOTAL - .001; playing = false; }
  }
  if (!playing && !vo.paused) vo.pause();
  render(); requestAnimationFrame(loop);
}
const vo = document.getElementById('vo'), so = document.getElementById('startov'), mu = document.getElementById('mu');
const toggle = () => { so.classList.add('off'); if (!playing && t >= TOTAL - .01) t = 0; playing = !playing; if (playing) { vo.currentTime = t; vo.play().catch(() => {}); } else vo.pause(); };
const setMute = () => { vo.muted = !vo.muted; mu.textContent = vo.muted ? 'Voice off' : 'Voice on'; };
so.onclick = toggle; mu.onclick = setMute;
const seek = x => { t = clamp(x, 0, TOTAL - .001); cur = -1; if (vo.readyState >= 1) vo.currentTime = t; };
pp.onclick = toggle;

/* start at once: with voice when the browser allows it, otherwise silent until the first click or key */
function start() {
  started = true; so.classList.add('off');
  if (playing) return;
  if (t >= TOTAL - .01) t = 0;
  playing = true; vo.currentTime = t; vo.muted = false;
  vo.play().catch(() => {
    vo.muted = true; mu.textContent = 'Voice off · click to hear'; vo.play().catch(() => {});
    const on = () => { unmute(); removeEventListener('pointerdown', on, true); removeEventListener('keydown', on, true); };
    addEventListener('pointerdown', on, true); addEventListener('keydown', on, true);
  });
}
function unmute() { if (!vo.muted) return; vo.muted = false; mu.textContent = 'Voice on'; vo.currentTime = t; if (playing) vo.play().catch(() => {}); }
if (!/[?&](t=|autoplay=0)/.test(location.search)) start();
const prog = document.getElementById('prog');
prog.addEventListener('click', e => { const b = prog.getBoundingClientRect(); seek((e.clientX - b.left) / b.width * TOTAL); });
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { /* not available here */ } setTimeout(fit, 120); }
document.addEventListener('fullscreenchange', () => { const on = !!document.fullscreenElement; document.body.classList.toggle('isfs', on); fsb.textContent = on ? '⤡ Exit full screen' : '⛶ Full screen'; setTimeout(fit, 60); });
const fsb = document.getElementById('fs'); fsb.onclick = full; document.getElementById('fsx').onclick = full;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); full(); }
  else if (e.key === 'm' || e.key === 'M') setMute();
  else if (e.key === 'ArrowRight') seek(t + 5); else if (e.key === 'ArrowLeft') seek(t - 5);
});
// ?t=seconds or #s5 jumps for checking
const hs = /^#s(\d+)$/.exec(location.hash); if (hs) t = starts[clamp(+hs[1] - 1, 0, SC.length - 1)] + .01;
requestAnimationFrame(loop);
window.__gm = { start, unmute, seek: x => { seek(x); render(); }, pause: () => { playing = false; so.classList.add('off'); }, starts, TOTAL, scenes: SC.map(s => s.title) };
})();
